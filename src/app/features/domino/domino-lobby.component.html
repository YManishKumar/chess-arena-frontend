<div class="wait-wrap">
  <div class="wait-card" *ngIf="room">
    <div class="room-header">
      <div class="room-title">Waiting Room</div>
      <div class="room-code-wrap">
        <span class="room-code">{{ code }}</span>
        <button class="copy-btn" (click)="copyCode()" title="Copy code">⎘</button>
      </div>
      <div class="room-hint">Share code with friends to join</div>
    </div>

    <div class="bet-badge">⭐ {{ room.bet }} coins bet</div>

    <div class="seats-grid">
      <div class="seat" *ngFor="let seat of seats; let i = index">
        <div class="seat-avatar" [class.bot]="seat.is_bot">
          {{ seat.is_bot ? '🤖' : initials(seat.name) }}
        </div>
        <div class="seat-name">{{ seat.name }}</div>
        <div class="seat-badge" *ngIf="seat.id === room.host_id">host</div>
        <div class="seat-badge you" *ngIf="seat.id === userId && seat.id !== room.host_id">you</div>
      </div>
      <div class="seat empty" *ngFor="let _ of [].constructor(emptySlots)">
        <div class="seat-avatar empty">＋</div>
        <div class="seat-name">Waiting…</div>
      </div>
    </div>

    <div class="player-count">{{ humanSeats.length }}/4 players · AI fills remaining seats</div>

    <button class="start-btn" *ngIf="isHost" (click)="startGame()" [disabled]="!canStart">
      {{ starting ? 'Starting…' : '▶ Start Game' }}
    </button>

    <div class="waiting-msg" *ngIf="!isHost">
      Waiting for host to start…
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <button class="back-btn" (click)="goBack()">← Leave Room</button>
  </div>

  <div class="loading" *ngIf="!room && !error">Loading room…</div>
  <div class="error-msg full" *ngIf="error && !room">{{ error }}</div>
</div>
